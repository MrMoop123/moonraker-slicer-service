[project]
name = "moonraker-slicer-service"
version = "0.1.0"
description = "Moonraker-compatible slicing service for headless 3D printing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "aiofiles>=24.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
moonraker = ["httpx>=0.28"]
dev = ["pytest>=8.0", "httpx>=0.28", "pytest-asyncio>=0.24", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
